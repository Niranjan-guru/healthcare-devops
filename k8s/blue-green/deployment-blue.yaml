apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-blue
  namespace: healthcare
  labels:
    app: healthcare
    environment: blue
  annotations:
    healthcare.pbl/role: "Activity 8 blue-green environment (blue)"
spec:
  replicas: 2

  # The production Service selects environment=blue or environment=green;
  # the pipeline switches it only after this environment has been validated.
  selector:
    matchLabels:
      app: healthcare
      environment: blue

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: healthcare
        environment: blue

    spec:
      # Least privilege: the app never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # Writable scratch space for Gunicorn worker heartbeats; the root
        # filesystem itself is read-only.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      containers:
        - name: healthcare-app
          # The blue-green pipeline replaces this tag (and the replica count)
          # with the exact immutable image of the build being released.
          image: niranjanbalaguru/healthcare-app:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          env:
            - name: PYTHONUNBUFFERED
              value: "1"

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
