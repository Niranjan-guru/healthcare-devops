# Production entry point for the Healthcare application (Activity 8).
# The `environment` selector decides whether blue or green receives traffic.
# The pipeline creates this Service only if it does not exist and afterwards
# changes the selector exclusively through the validated switch / rollback
# operations, so re-running a pipeline never silently moves traffic.
apiVersion: v1
kind: Service
metadata:
  name: healthcare-service
  namespace: healthcare
  labels:
    app: healthcare
    role: production
spec:
  type: NodePort
  selector:
    app: healthcare
    environment: blue
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30060
