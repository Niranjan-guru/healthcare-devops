apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-green
  namespace: healthcare
  labels:
    app: healthcare
    environment: green
  annotations:
    healthcare.pbl/role: "Activity 8 blue-green environment (green)"
spec:
  replicas: 2

  # The production Service selects environment=blue or environment=green;
  # the pipeline switches it only after this environment has been validated.
  selector:
    matchLabels:
      app: healthcare
      environment: green

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: healthcare
        environment: green

    spec:
      containers:
        - name: healthcare-app
          # The blue-green pipeline replaces this tag (and the replica count)
          # with the exact immutable image of the build being released.
          image: niranjanbalaguru/healthcare-app:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          env:
            - name: PYTHONUNBUFFERED
              value: "1"

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
