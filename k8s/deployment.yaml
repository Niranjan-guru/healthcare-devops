apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-deployment
  namespace: healthcare
  labels:
    app: healthcare
spec:
  replicas: 2

  selector:
    matchLabels:
      app: healthcare

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: healthcare

    spec:
      containers:
        - name: healthcare-app
          image: niranjanbalaguru/healthcare-app:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: PYTHONUNBUFFERED
              value: "1"

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
