# Activity 7 (rolling update) Service. The production entry point
# healthcare-service (NodePort 30060) is owned by the Activity 8 blue/green
# pipeline; see k8s/blue-green/.
apiVersion: v1
kind: Service
metadata:
  name: healthcare-rolling-service
  namespace: healthcare
  labels:
    app: healthcare
    environment: rolling
spec:
  type: NodePort
  selector:
    app: healthcare
    environment: rolling
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30061
