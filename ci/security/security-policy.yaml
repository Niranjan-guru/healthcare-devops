  - id: CVE-2026-16742
    control: container
    severity: HIGH
    packages: [libsystemd0, libudev1]
    summary: "systemd: systemd-homed: Local privilege escalation via missing home-record signature verification"
    reason: >-
      No fixed Debian 13 package is available (Trivy: no fix version). systemd-homed privilege escalation affecting the systemd libraries. No systemd/homed service runs inside the container.
    mitigation: >-
      Container has no init system or homed daemon; non-root, capabilities dropped, no privilege escalation. Re-scanned on every build; remove this exception as soon as a fixed base image is published.
    owner: Project owner (PBL-III student)
    approved_by: Project owner (PBL-III student) - explicit approval recorded 2026-11-14
    approved_on: 2026-11-14
    expires: 2026-12-31
  - id: CVE-2026-54369
    control: container
    severity: HIGH
    packages: [libacl1]
    summary: "acl: Symlink traversal privilege escalation via libacl functions"
    reason: >-
      No fixed Debian 13 package is available (Trivy: no fix version). Symlink traversal in libacl functions used by privileged file tools. No privileged process in the container uses libacl on attacker-controlled paths.
    mitigation: >-
      Non-root UID 10001, capabilities dropped, read-only root filesystem, no file-upload or path input in the API. Re-scanned on every build; remove this exception as soon as a fixed base image is published.
    owner: Project owner (PBL-III student)
    approved_by: Project owner (PBL-III student) - explicit approval recorded 2026-11-14
    approved_on: 2026-11-14
    expires: 2026-12-31
  - id: CVE-2026-76642
    control: container
    severity: HIGH
    packages: [bsdutils, libblkid1, liblastlog2-2, libmount1, libsmartcols1, libuuid1, login, mount, util-linux]
    summary: "util-linux: util-linux: failed external mount helper still runs privileged X-mount post-hooks"
    reason: >-
      No fixed Debian 13 package is available (Trivy: no fix version). Flaws in mount helpers / nsenter (util-linux). The application never executes mount, nsenter or other util-linux tools; they are inert files in the base image.
    mitigation: >-
      Container runs as UID 10001 with all Linux capabilities dropped, allowPrivilegeEscalation=false (no_new_privs, so setuid binaries cannot gain privileges), read-only root filesystem and seccomp RuntimeDefault; no shell or exec endpoint is exposed. Re-scanned on every build; remove this exception as soon as a fixed base image is published.
    owner: Project owner (PBL-III student)
    approved_by: Project owner (PBL-III student) - explicit approval recorded 2026-11-14
    approved_on: 2026-11-14
    expires: 2026-12-31
