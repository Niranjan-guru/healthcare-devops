# Release security policy for the Healthcare DevSecOps pipeline (Activity 9).
# Evaluated by ci/security/evaluate_policy.py. Human-readable rationale:
# docs/security-policy.md.
#
# A finding with a severity listed under `block` fails the build unless an
# exception below matches it EXACTLY (control + finding id + severity, and
# package where given), carries every required field, and has not expired.
# Blanket exceptions ("*", "ALL") are rejected by the evaluator.
version: 1

gates:
  secrets:        # Gitleaks - any detected secret blocks the release
    block_any: true
  sast:           # Semgrep severities: ERROR / WARNING / INFO
    block: [ERROR]
  dependencies:   # pip-audit - every known vulnerability in a pinned dependency blocks
    block_any: true
  container:      # Trivy image severities
    block: [CRITICAL, HIGH]
  dockerfile:     # Trivy misconfiguration severities
    block: [CRITICAL, HIGH]
  kubernetes:
    block: [CRITICAL, HIGH]
  dast:           # OWASP ZAP risk levels: High / Medium / Low / Informational
    block: [High]

# Approved exceptions. Each entry needs: id, control, severity, (packages),
# reason, mitigation, owner, approved_by, approved_on, expires.
# The 11 entries below cover HIGH OS-package CVEs in the python:3.12-slim
# (Debian 13.7) base for which Debian has published NO fix. They were
# approved explicitly by the project owner on 2026-11-14 after reviewing
# the exploitability analysis in docs/security-policy.md. Any other HIGH or
# CRITICAL finding - or these CVEs in any other package - still blocks.
exceptions:
  - id: CVE-2025-69720
    control: container
    severity: HIGH
    packages: [libncursesw6, libtinfo6, ncurses-base, ncurses-bin]
    summary: "ncurses: ncurses: Buffer overflow vulnerability may lead to arbitrary code execution."
    reason: >-
      No fixed Debian 13 package is available (Trivy: no fix version). Buffer overflow in ncurses terminfo handling. The application has no terminal UI and never loads curses.
    mitigation: >-
      No TTY is allocated to the pods; non-root, read-only root filesystem, capabilities dropped. Re-scanned on every build; remove this exception as soon as a fixed base image is published.
    owner: Project owner (PBL-III student)
    approved_by: Project owner (PBL-III student) - explicit approval recorded 2026-11-14
    approved_on: 2026-11-14
    expires: 2026-12-31
  - id: CVE-2026-119373
    control: container
    severity: HIGH
    packages: [libsqlite3-0]
    summary: "sqlite: sqlite: Denial of service via heap-based buffer overflow in FTS5"
    reason: >-
      No fixed Debian 13 package is available (Trivy: no fix version). Flaws in SQLite FTS5 / session extensions. The application stores synthetic data in memory and never opens a SQLite database.
    mitigation: >-
      No SQL or database input reachable from the API; non-root, read-only root filesystem. Re-scanned on every build; remove this exception as soon as a fixed base image is published.
    owner: Project owner (PBL-III student)
    approved_by: Project owner (PBL-III student) - explicit approval recorded 2026-11-14
    approved_on: 2026-11-14
    expires: 2026-12-31
