openapi: 3.0.3
info:
  title: Healthcare Appointment Management (synthetic demo)
  description: >
    Academic demonstration API using synthetic data only. Used by the
    Activity 9 DAST stage (OWASP ZAP API scan) against a disposable,
    isolated container.
  version: "1.0"
servers:
  - url: http://healthcare-dast-target:5000
paths:
  /:
    get:
      summary: Application metadata
      responses:
        "200": { description: OK }
  /health:
    get:
      summary: Health check
      responses:
        "200": { description: Healthy }
  /version:
    get:
      summary: Deployed version
      responses:
        "200": { description: Version }
  /api/deployment:
    get:
      summary: Environment, version and pod that served the request
      responses:
        "200": { description: Deployment information }
  /api/doctors:
    get:
      summary: List synthetic doctors
      responses:
        "200": { description: Doctors }
  /api/appointments:
    get:
      summary: List appointments
      responses:
        "200": { description: Appointments }
    post:
      summary: Create a synthetic appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doctor_id, patient_name, appointment_date]
              properties:
                doctor_id: { type: integer, example: 1 }
                patient_name: { type: string, example: "Synthetic Patient" }
                appointment_date: { type: string, format: date, example: "2030-01-15" }
      responses:
        "201": { description: Created }
        "400": { description: Validation error }
        "404": { description: Unknown doctor }
