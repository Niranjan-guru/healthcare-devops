<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="panel-token" content="__CSRF_TOKEN__">
  <title>Blue-Green Demo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/panel.css">
</head>
<body>
  <main>
    <h1>Blue-Green Deployment Demo</h1>

    <section class="now" id="now" data-env="unknown">
      <span class="now-label">The website is running on</span>
      <span class="now-env" id="now-env">…</span>
      <span class="now-version" id="now-version"></span>
    </section>

    <section class="buttons">
      <button type="button" class="blue" id="btn-blue">Turn ON Blue</button>
      <button type="button" class="green" id="btn-green">Turn ON Green</button>
    </section>

    <a class="open" id="open" href="http://127.0.0.1:18060/" target="_blank" rel="noopener">Open the website ↗</a>

    <section class="result" id="result" role="status" hidden>
      <div class="result-title" id="result-title"></div>
      <ol id="steps"></ol>
    </section>

    <p class="status" id="status">Blue: - &nbsp;·&nbsp; Green: -</p>
  </main>
  <script src="/static/panel.js"></script>
</body>
</html>
